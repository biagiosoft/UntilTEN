<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Until Ten</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080e22;color:#f5f8ff;display:flex;justify-content:center;align-items:center;min-height:100dvh}#app{width:min(100vw,calc(100dvh * 440 / 956));max-width:none;height:min(100dvh,calc(100vw * 956 / 440));min-height:0;display:flex;flex-direction:column;background:linear-gradient(#141b3d,#080d20)}header{padding:12px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:20px;letter-spacing:2px;margin:0;color:#e7f5ff}small{color:#92a4d2}.stat{background:#202b50;border:1px solid #3a4b7b;border-radius:12px;padding:7px 11px;text-align:center;min-width:90px}.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:#b8c8ed}.top{display:flex;align-items:center;gap:7px;padding:0 12px 10px}.top .stat{flex:1}#scoreBox{flex:0 0 108px!important;min-width:108px;height:92px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:visible}#scoreBox .scoreSphere{width:88px;height:88px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 31% 23%,#f6ffff 0%,#9cf6ff 10%,#35d5ed 30%,#1671c7 62%,#102a78 84%,#09132c 100%);box-shadow:inset -9px -13px 16px #03132bba,inset 3px 4px 8px #e0ffff88,0 0 17px #20d5f577,0 6px 12px #0007;transform-origin:50% 75%;will-change:transform}#scoreBox .scoreSphere:before{content:"";position:absolute;left:17%;top:12%;width:44%;height:18%;border-radius:50%;transform:rotate(-30deg);background:#ffffff91;filter:blur(3px)}#scoreBox .scoreSphere span{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#e7ffff;z-index:1;text-shadow:0 1px 4px #003b69}#scoreBox .scoreSphere b{font-size:25px;line-height:1.15;color:white;text-shadow:0 2px 5px #002a59;z-index:1;max-width:82px;overflow:hidden;font-variant-nu @keyframes bonusEnter{0%{transform:translate(-50%,-50%) scale(.1) rotate(-12deg);opacity:0}35%{transform:translate(-50%,-50%) scale(1.22) rotate(3deg);opacity:1}55%{transform:translate(-50%,-50%) scale(.93) rotate(-2deg)}75%{transform:translate(-50%,-50%) scale(1.05)}100%{transform:translate(-50%,-50%) scale(1)}}@keyframes bonusSpin{to{transform:rotate(360deg)}}@keyframes bonusGlitter{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}#bonusShow{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;visibility:hidden;overflow:hidden;transition:opacity .22s}#bonusShow.active{opacity:1;visibility:visible}#bonusShow .bonusHalo{position:absolute;inset:0;background:radial-gradient(ellipse at center,#fff8a644 0%,#fdb5273a 18%,#a73bd21e 40%,transparent 70%)}#bonusShow .bonusRays{position:absolute;left:50%;top:50%;width:125vmin;height:125vmin;max-width:650px;max-height:650px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,#fff6ac55 0deg 9deg,transparent 9deg 23deg);border-radius:50%;mask-image:radial-gradient(circle,transparent 0 12%,#000 23%,transparent 67%);animation:bonusSpin 9s linear infinite}#bonusShow .bonusWords{position:absolute;left:50%;top:50%;width:100%;text-align:center;transform:translate(-50%,-50%);animation:bonusEnter .65s cubic-bezier(.18,.9,.2,1.2) both}#bonusShow .bonusHeadline{font-family:Impact,Haettenschweiler,Arial Black,system-ui,sans-serif;font-size:clamp(27px,8.3vw,49px);font-weight:1000;font-style:italic;letter-spacing:-1.3px;line-height:1.15;color:#fff5a2;background:linear-gradient(#fffef1 0%,#ffe875 35%,#ffab20 64%,#e04b11 100%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.6px #fff2a5;filter:drop-shadow(0 3px 0 #9b300e) drop-shadow(0 6px 0 #672072) drop-shadow(0 9px 9px #000b);transform:rotate(-4deg);white-space:nowrap}#bonusShow .bonusMedal{width:125px;height:125px;margin:10px auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 28% 23%,#fffbd6 0%,#ffe46d 19%,#ffae19 46%,#d36908 75%,#783006 100%);box-shadow:inset -10px -13px 15px #7a2709aa,inset 5px 6px 12px #fff5b6aa,0 0 0 5px #fff5b8aa,0 0 30px 12px #ffce49aa,0 10px 20px #0008;animation:bonusGlitter .32s ease-in-out infinite}#bonusShow .bonusMedal span{font-family:Impact,Arial Black,system-ui,sans-serif;font-weight:1000;font-size:40px;color:#fffbe5;text-shadow:0 3px 1px #ad520a,0 5px 8px #6c2409}#bonusShow .bonusSubtitle{font-family:Impact,Arial Black,system-ui,sans-serif;font-weight:1000;font-size:clamp(13px,3.6vw,20px);letter-spacing:1px;color:#fffbe0;-webkit-text-stroke:.4px #7a267a;text-shadow:0 3px 0 #a23391,0 5px 9px #000b}#bonusShow .bonusStars{position:absolute;inset:0}#bonusShow .bonusStars i{position:absolute;left:50%;top:50%;width:9px;height:9px;background:#fff8ac;box-shadow:0 0 13px 4px #ffd456;border-radius:2px;transform:translate(-50%,-50%) rotate(45deg);animation:starFly 1.6s ease-out infinite;animation-delay:var(--delay)}@keyframes starFly{0%{transform:translate(-50%,-50%) rotate(45deg) scale(.1);opacity:0}25%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(225deg) scale(.1);opacity:0}}#bonusShow.freezeEffect .bonusHeadline{background:linear-gradient(#fff 0%,#c8faff 32%,#54d7ff 70%,#2b77ed);background-clip:text;-webkit-background-clip:text;-webkit-text-stroke:1.5px #b9faff;filter:drop-shadow(0 4px 0 #1763b8) drop-shadow(0 8px 12px #000a)}#bonusShow.freezeEffect .bonusMedal{background:radial-gradient(circle at 28% 23%,#fff 0%,#c8fbff 25%,#51c7fb 58%,#1757c5 100%);box-shadow:inset -10px -12px 16px #0d3978,0 0 0 5px #b9f9ff,0 0 28px 12px #5de4ff99}#bonusShow.boomEffect .bonusHeadline{background:linear-gradient(#fff7b0,#ffb72e 45%,#ff401a 85%);background-clip:text;-webkit-background-clip:text;-webkit-text-stroke:1.5px #ffe681;filter:drop-shadow(0 4px 0 #9d1c09) drop-shadow(0 8px 12px #000b)}#bonusShow.boomEffect .bonusMedal{background:radial-gradient(circle at 28% 23%,#fff6bb,#ffb12a 35%,#ed4b14 75%,#77200b);box-shadow:inset -10px -12px 16px #6c2009,0 0 0 5px #ffd16c,0 0 28px 12px #ff682c99}#bonusShow.actionEffect .bonusMedal{display:none}#bonusShow.actionEffect .bonusSubtitle{margin-top:12px}</style></head><body><div id="app"><header><div><h1>UNTIL <span style="color:#58e7f3">TEN</span> <span id="gameVersion" style="font-size:11px;font-weight:600;letter-spacing:0;color:#92a4d2;vertical-align:middle">v26</span></h1><small>Seleziona le sfere, raggiungi dieci</small></div><button id="settings">⚙ Opzioni</button></header><div class="top"><div class="stat" id="scoreBox"><div class="scoreSphere" id="scoreSphere"><span>SCORE</span><b id="score">0</b></div></div><div class="stat"><span>ERRORI</span><b class="error" id="errors">0 / 10</b></div><div class="stat"><span>TEMPO</span><b id="time">0:00</b></div></div><div class="stage" id="stage"><canvas id="game"></canvas><div id="comboCount" style="position:absolute;z-index:2;bottom:2px;left:50%;transform:translateX(-50%);color:#dcecff;font-size:11px;font-weight:800;letter-spacing:.3px;pointer-events:none;display:none;white-space:nowrap;text-shadow:0 1px 4px #000"></div><div id="bonusShow" aria-hidden="true"><div class="bonusHalo"></div><div class="bonusRays"></div><div class="bonusStars"></div><div class="bonusWords"><div class="bonusHeadline" id="bonusHeadline">SUPER BONUS!</div><div class="bonusMedal" id="bonusMedal"><span id="bonusPoints">+300</span></div><div class="bonusSubtitle" id="bonusSubtitle">COMBINAZIONE INCREDIBILE!</div></div></div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');const $=s=>document.querySelector(s);const colors=['','#ff354f','#ff8a1d','#f6d528','#45e663','#22d9c5','#258cf9','#9355f6','#e52cc8','#ff68ad'];let cfg={speed:15,accel:5,gap:12.6,maxErrors:10,sound:true,volume:55,music:true,musicVolume:55,musicStyle:2};let balls=[],particles=[],shockwaves=[],bonusCelebrations=[],flights=[],selected=[],score=0,errors=0,elapsed=0,spawnY=0,paused=true,ended=false,last=0,W=400,H=600,r=30,nextId=0,scoreFlash=0,scoreBatch=0,scorePending=new Map(),freezeLeft=0,mode='start';let audioCtx=null,musicNext=0,musicBeat=0;let celebrationQueue=[];function musicAudio(){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx;}catch{return null;}}function musicNote(a,freq,when,duration,type,level){const osc=a.createOscillator(),gain=a.createGain(),filter=a.createBiquadFilter();osc.type=type;osc.frequency.setValueAtTime(freq,when);filter.type='lowpass';filter.frequency.value=type==='sawtooth'?1350:2400;const vol=Math.max(.0001,cfg.musicVolume/100*level);gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(vol,when+.012);gain.gain.exponentialRampToValueAtTime(.0001,when+duration);osc.connect(filter).connect(gain).connect(a.destination);osc.start(when);osc.stop(when+duration+.02);}function bonusFanfare(){const a=musicAudio();if(!a||!cfg.sound)return;const t=a.currentTime+.015,notes=[523.25,659.25,783.99,1046.5,1318.51,1567.98];for(let i=0;i<notes.length;i++){const o=a.createOscillator(),g=a.createGain(),at=t+i*.095;o.type=i%2?'triangle':'square';o.frequency.value=notes[i];g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(Math.max(.0001,cfg.volume/100*.16),at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+.26);o.connect(g).connect(a.destination);o.start(at);o.stop(at+.27);}}function musicTick(){if(paused||ended||!cfg.music||cfg.musicVolume<=0)return;const a=musicAudio();if(!a||a.state!=='running')return;const difficulty=Math.min(1,elapsed/240),style=Number(cfg.musicStyle)||0;const bpms=[90,76,105,112],bpm=bpms[style]+Math.round(difficulty*[52,20,40,38][style]),beatDur=60/bpm/2;if(musicNext<a.currentTime-.4)musicNext=a.currentTime+.035;if(!musicNext)musicNext=a.currentTime+.035;const patterns=[{bass:[110,110,146.83,110,130.81,130.81,164.81,98],lead:[440,523.25,659.25,523.25,392,523.25,587.33,493.88],wave:'triangle',mel:'sine'},{bass:[98,98,130.81,130.81,110,110,146.83,146.83],lead:[293.66,349.23,392,349.23,261.63,293.66,349.23,261.63],wave:'sine',mel:'sine'},{bass:[130.81,130.81,196,164.81,146.83,146.83,220,196],lead:[523.25,659.25,783.99,659.25,587.33,783.99,880,659.25],wave:'square',mel:'triangle'},{bass:[82.41,82.41,123.47,98,110,110,146.83,123.47],lead:[329.63,392,493.88,587.33,493.88,392,329.63,293.66],wave:'sawtooth',mel:'square'}];const p=patterns[style]||patterns[0];let scheduled=0;while(musicNext<a.currentTime+.12&&scheduled++<4){const n=musicBeat%16,step=n%8;musicNote(a,p.bass[step],musicNext,beatDur*.75,p.wave,style===3?.048:.085);if(n%2===0||style===2)musicNote(a,p.lead[Math.floor(musicBeat/2)%8],musicNext,beatDur*(style===1?1.25:.64),p.mel,style===3?.024:.04+difficulty*.02);if(difficulty>.32&&n%4===2)musicNote(a,p.lead[(step+3)%8]*2,musicNext,beatDur*.28,'square',.01);if(difficulty>.65&&n%2===1)musicNote(a,880,musicNext,beatDur*.09,'triangle',.008);musicBeat++;musicNext+=beatDur;}}function audio(){if(!cfg.sound)return null;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}catch{return null;}}
function pop(deselect=false){const a=audio();if(!a)return;const play=()=>{const t=a.currentTime+.005,o=a.createOscillator(),g=a.createGain(),filter=a.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(deselect?420:690,t);o.frequency.exponentialRampToValueAtTime(deselect?240:330,t+.115);filter.type='lowpass';filter.frequency.value=1800;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,cfg.volume/100*.42),t+.009);g.gain.exponentialRampToValueAtTime(.0001,t+.145);o.connect(filter).connect(g).connect(a.destination);o.start(t);o.stop(t+.15);};if(a.state==='running')play();else a.resume().then(play).catch(()=>{});}
function ding(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(750,t);o.frequency.exponentialRampToValueAtTime(1100,t+.11);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,cfg.volume/100*.075),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.17);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.18);}
function bombBoom(){const a=audio();if(!a)return;const t=a.currentTime,d=.68,samples=Math.floor(a.sampleRate*d),buffer=a.createBuffer(1,samples,a.sampleRate),data=buffer.getChannelData(0);let low=0;for(let i=0;i<samples;i++){low=(low+(Math.random()*2-1)*.17)/1.17;const p=i/samples;data[i]=low*Math.pow(1-p,1.45);}const src=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain();src.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(1500,t);filter.frequency.exponentialRampToValueAtTime(85,t+d);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,cfg.volume/100*.9),t+.016);gain.gain.exponentialRampToValueAtTime(.0001,t+d);src.connect(filter).connect(gain).connect(a.destination);src.start(t);src.stop(t+d);const osc=a.createOscillator(),sub=a.createGain();osc.type='sine';osc.frequency.setValueAtTime(125,t);osc.frequency.exponentialRampToValueAtTime(36,t+.4);sub.gain.setValueAtTime(.0001,t);sub.gain.exponentialRampToValueAtTime(Math.max(.0001,cfg.volume/100*.36),t+.012);sub.gain.exponentialRampToValueAtTime(.0001,t+.43);osc.connect(sub).connect(a.destination);osc.start(t);osc.stop(t+.45);}function explosion(){const a=audio();if(!a)return;const t=a.currentTime,d=.24,buffer=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),data=buffer.getChannelData(0);let prev=0;for(let i=0;i<data.length;i++){const white=Math.random()*2-1;prev=(prev+white*.18)/1.18;data[i]=prev*Math.pow(1-i/data.length,2);}const source=a.createBufferSource(),filter=a.createBiquadFilter(),g=a.createGain();source.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(1350,t);filter.frequency.exponentialRampToValueAtTime(180,t+d);g.gain.value=cfg.volume/100*.85;source.connect(filter).connect(g).connect(a.destination);source.start(t);source.stop(t+d);}
const rand=()=>1+Math.floor(Math.random()*9);const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function resize(){const rect=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=rect.width;H=rect.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);r=Math.min(W>=700?75:35,(W-24)/10.7);}
function addRow(y){const spacing=(W-24)/5;for(let i=0;i<5;i++)balls.push({id:++nextId,n:rand(),x:12+spacing*(i+.5),y,r:r*.87,selected:false,dy:0});}
function reset(){document.querySelector('#bonusShow').classList.remove('active');musicAudio();musicNext=0;musicBeat=0;balls=[];particles=[];shockwaves=[];bonusCelebrations=[];celebrationQueue=[];flights=[];selected=[];score=0;errors=0;elapsed=0;scoreFlash=0;scoreBatch=0;scorePending.clear();freezeLeft=0;document.querySelector('#scoreSphere').classList.remove('bounce');nextId=0;addRow(H+r*.6);spawnY=H+r*.6;paused=false;ended=false;mode='play';overlay.classList.add('hidden');sync();}
function sync(){const cc=$('#comboCount');const total=selected.reduce((s,b)=>s+b.n,0);cc.style.display=selected.length?'block':'none';cc.textContent=selected.length+' sfere · '+total+'/10';$('#score').textContent=score;$('#errors').textContent=errors+' / '+cfg.maxErrors;$('#time').textContent=freezeLeft>0?'❄ '+freezeLeft.toFixed(1)+'s':Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');}
function show(title,body,buttons){panel.innerHTML='<h2>'+title+'</h2><p>'+body+'</p>'+buttons;overlay.classList.remove('hidden');}
function startScreen(){mode='start';paused=true;show('Pronto a giocare?','Le righe di cinque sfere salgono verso la cima. Seleziona sfere che sommano <b>10</b>: ogni sfera vale 10 punti. Con <b>4 sfere</b> ottieni ❄: toccalo per congelare la salita per <b>4 secondi</b>, oppure lascialo arrivare alle punte per <b>100 punti</b>. Con <b>5 sfere</b> ottieni una bomba: toccala per eliminare le sfere in un quadrato di due posizioni per lato, oppure lasciala arrivare alle punte per <b>200 punti</b>. Con <b>6 o più sfere</b> appare una celebrazione dorata e il premio vola automaticamente allo score: 300 punti con 6, 500 con 7, 750 con 8, 1000 con 9 o più. Dopo <b>10 esplosioni</b> la partita termina.','<button class="primary" id="go">Inizia partita</button><button id="rankStart" style="width:100%;margin-top:8px">🏆 Classifica TOP 10</button>');$('#go').onclick=reset;$('#rankStart').onclick=()=>showRanking('start');}
function options(){const wasPaused=paused;paused=true;mode='options';show('Opzioni','Personalizza il ritmo della partita.',`<label>Velocità iniziale <output id="sv">${cfg.speed}</output></label><input id="speed" type="range" min="8" max="70" value="${cfg.speed}"><label>Accelerazione (pixel/s ogni minuto) <output id="av">${cfg.accel}</output></label><input id="accel" type="range" min="0" max="35" value="${cfg.accel}"><label>Distanza tra le righe <output id="gv">${cfg.gap}</output></label><input id="gap" type="range" min="0" max="75" step="0.5" value="${cfg.gap}"><label>Errori massimi <output id="ev">${cfg.maxErrors}</output></label><input id="maxErrors" type="range" min="1" max="20" value="${cfg.maxErrors}"><label style="display:flex;align-items:center;gap:10px"><input id="sound" type="checkbox" ${cfg.sound?"checked":""} style="width:20px;height:20px"> Effetti sonori</label><label>Volume effetti <output id="vv">${cfg.volume}%</output></label><input id="volume" type="range" min="0" max="100" value="${cfg.volume}"><label style="display:flex;align-items:center;gap:10px"><input id="music" type="checkbox" ${cfg.music?"checked":""} style="width:20px;height:20px"> Musica di sottofondo</label><label>Stile musicale</label><select id="musicStyle" style="width:100%;padding:10px;background:#101936;color:#fff;border:1px solid #6077a8;border-radius:8px"><option value="0" ${cfg.musicStyle===0?"selected":""}>Electro arcade dinamica</option><option value="1" ${cfg.musicStyle===1?"selected":""}>Ambient spaziale</option><option value="2" ${cfg.musicStyle===2?"selected":""}>Arcade allegra</option><option value="3" ${cfg.musicStyle===3?"selected":""}>Retro 8-bit</option></select><label>Volume musica <output id="mv">${cfg.musicVolume}%</output></label><input id="musicVolume" type="range" min="0" max="100" value="${cfg.musicVolume}"><button class="primary" id="save">Salva e torna al gioco</button>`);for(const [k,o] of [['speed','sv'],['accel','av'],['gap','gv'],['maxErrors','ev'],['volume','vv'],['musicVolume','mv']])$('#'+k).oninput=e=>$('#'+o).textContent=e.target.value;$('#save').onclick=()=>{for(const k of Object.keys(cfg))cfg[k]=(k==='sound'||k==='music')?$('#'+k).checked:Number($('#'+k).value);sync();if(ended){gameOver();return;}if(mode==='options'&&balls.length===0&&elapsed===0){startScreen();return;}paused=wasPaused;musicNext=0;musicBeat=0;mode='play';overlay.classList.add('hidden');};}
const RANK_KEY='untilten_top10_v1';function getRanking(){try{const data=JSON.parse(localStorage.getItem(RANK_KEY)||'[]');return Array.isArray(data)?data.filter(v=>v&&typeof v.score==='number'&&typeof v.name==='string').sort((a,b)=>b.score-a.score).slice(0,10):[];}catch{return [];}}function saveRanking(name,points){const list=getRanking();list.push({name,score:points,date:new Date().toISOString().slice(0,10)});list.sort((a,b)=>b.score-a.score);try{localStorage.setItem(RANK_KEY,JSON.stringify(list.slice(0,10)));}catch{}}function showRanking(origin='start'){paused=true;mode='ranking';const entries=getRanking();const rows=entries.length?entries.map((e,i)=>'<div style="display:flex;gap:8px;justify-content:space-between;padding:7px 0;border-bottom:1px solid #33466f"><span>'+(i+1)+'. '+escapeRank(e.name)+'</span><b>'+e.score+'</b></div>').join(''):'<p>Ancora nessun punteggio registrato.</p>';show('🏆 TOP 10','Classifica salvata su questo dispositivo.<div style="max-height:40dvh;overflow-y:auto;margin-top:10px">'+rows+'</div>','<button class="primary" id="rankBack">'+(origin==='over'?'Rigioca':'Torna al gioco')+'</button>');$('#rankBack').onclick=origin==='over'?reset:()=>{if(origin==='start')startScreen();else{paused=false;mode='play';overlay.classList.add('hidden');}};}function escapeRank(s){return s.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function gameOver(){musicNext=0;ended=true;paused=true;mode='over';const entries=getRanking();const qualifies=score>0&&(entries.length<10||score>entries[entries.length-1].score);const body='Hai raggiunto <b>'+errors+' errori</b>.<br>Punteggio finale: <b style="font-size:30px;color:#6be6f6">'+score+'</b><br>Tempo: '+Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');if(qualifies){show('TOP 10! 🏆',body+'<br>Hai conquistato un posto in classifica!','<input id="playerName" maxlength="20" placeholder="Il tuo nome" autocomplete="nickname" style="width:100%;padding:12px;border-radius:9px;background:#101936;color:white;border:1px solid #6077a8"><button class="primary" id="saveRank">Salva punteggio</button><button id="again" style="width:100%;margin-top:8px">Rigioca senza salvare</button>');$('#saveRank').onclick=()=>{const name=($('#playerName').value.trim()||'Giocatore').slice(0,20);saveRanking(name,score);showRanking('over');};}else{show('GAME OVER',body,'<button class="primary" id="again">Rigioca</button><button id="viewRank" style="width:100%;margin-top:8px">🏆 Classifica TOP 10</button>');$('#viewRank').onclick=()=>showRanking('over');}$('#again').onclick=reset;}
function burst(x,y,color){for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,v=35+Math.random()*110;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.45+Math.random()*.4,max:.8,color,size:2+Math.random()*4});}}
function startCelebration(){if(bonusCelebrations.length||!celebrationQueue.length)return;const item=celebrationQueue.shift(),showBonus=$('#bonusShow');bonusCelebrations.push({x:W/2,y:H/2,age:0,points:item.points||0,launched:false,type:item.type});showBonus.className='active '+(item.type==='freeze'?'freezeEffect actionEffect':item.type==='boom'?'boomEffect actionEffect':item.type==='unusedFreeze'?'freezeEffect':item.type==='unusedBomb'?'boomEffect':'');$('#bonusHeadline').textContent=item.type==='freeze'?'FREEZE!':item.type==='boom'?'BOOM!':item.type==='unusedFreeze'||item.type==='unusedBomb'?'BONUS!':'SUPER BONUS!';$('#bonusPoints').textContent=item.points?'+'+item.points:'★';$('#bonusSubtitle').textContent=item.type==='freeze'?'TEMPO CONGELATO!':item.type==='boom'?'ESPLOSIONE!':item.type==='unusedFreeze'?'FREEZE RISPARMIATO!':item.type==='unusedBomb'?'BOMBA RISPARMIATA!':'COMBINAZIONE INCREDIBILE!';const stars=showBonus.querySelector('.bonusStars');stars.innerHTML=Array.from({length:28},(_,i)=>'<i style="--x:'+Math.round(Math.cos(i*2.399)*(65+Math.random()*170))+'px;--y:'+Math.round(Math.sin(i*2.399)*(75+Math.random()*210))+'px;--delay:'+(-Math.random()*1.6).toFixed(2)+'s"></i>').join('');if(item.type!=='boom')bonusFanfare();for(let j=0;j<5;j++)burst(W/2+(Math.random()-.5)*r*4,H/2+(Math.random()-.5)*r*4,item.type==='freeze'||item.type==='unusedFreeze'?'#8eefff':'#ffdc69');}function celebrate(type,points=0){celebrationQueue.push({type,points});startCelebration();}function complete(){const arr=[...selected];if(arr.length===0||arr.some(b=>!balls.includes(b)||b.freeze||b.bomb||b.bonus)||arr.reduce((sum,b)=>sum+b.n,0)!==10)return;const lowest=arr.length>=4?arr.reduce((a,b)=>b.y>a.y?b:a):null;const batch=++scoreBatch;scorePending.set(batch,arr.length);selected=[];balls=balls.filter(b=>!arr.includes(b));arr.forEach((b,i)=>flights.push({x:b.x,y:b.y,sx:b.x,sy:b.y,n:b.n,age:-i*.10,color:colors[b.n],trail:[],batch}));if(lowest&&arr.length<=5)balls.push({id:++nextId,n:0,freeze function choose(x,y){if(paused||ended)return;let b=null,best=Infinity;for(const q of balls){const d=dist(q,{x,y});if(d<q.r*1.2&&d<best){b=q;best=d;}}if(!b)return;if(b.freeze){balls=balls.filter(q=>q!==b);freezeLeft=4;burst(b.x,b.y,'#7befff');celebrate('freeze');ding();sync();return;}if(b.bonus){balls=balls.filter(q=>q!==b);flights.push({x:b.x,y:b.y,sx:b.x,sy:b.y,n:0,bonus:b.bonus,age:0,color:'#ffcf4b',trail:[]});ding();sync();return;}if(b.bomb){const cellX=(W-24)/5,cellY=2*r+cfg.gap;const hit=balls.filter(q=>q!==b&&!q.freeze&&!q.bomb&&Math.abs(q.x-b.x)<=2.5*cellX&&Math.abs(q.y-b.y)<=2.5*cellY);balls=balls.filter(q=>q!==b&&!hit.includes(q));selected=selected.filter(q=>!hit.includes(q));for(const q of hit){burst(q.x,q.y,colors[q.n]);burst(q.x,q.y,'#ffae40');}for(let k=0;k<8;k++)burst(b.x+(Math.random()-.5)*b.r*3,b.y+(Math.random()-.5)*b.r*3,'#ff9a3c');shockwaves.push({x:b.x,y:b.y,age:0,maxRadius:Math.max(2.5*cellX,2.5*cellY)});bombBoom();celebrate('boom');sync();return;}pop(b.selected);if(b.selected){b.selected=false;selected=selected.filter(v=>v!==b);}else{b.selected=true;selected.push(b);}const total=selected.reduce((s,v)=>s+v.n,0);if(total>10){selected.forEach(v=>v.selected=false);selected=[];}else if(total===10)complete();sync();}

x.fillStyle='#ffe97a';ctx.beginPath();ctx.ellipse(rr*.33,-rr*.99,rr*.08,rr*.17*flicker,.25,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0,rr*.12,rr*.37,Math.PI,0);ctx.lineTo(rr*.3,rr*.40);ctx.lineTo(-rr*.3,rr*.40);ctx.closePath();ctx.fill();ctx.fillStyle='#151a28';ctx.beginPath();ctx.ellipse(-rr*.16,rr*.10,rr*.105,rr*.13,-.18,0,Math.PI*2);ctx.ellipse(rr*.16,rr*.10,rr*.105,rr*.13,.18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(0,rr*.21);ctx.lineTo(-rr*.065,rr*.31);ctx.lineTo(rr*.065,rr*.31);ctx.closePath();ctx.fill();ctx.strokeStyle='#161a27';ctx.lineWidth=rr*.045;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(k*rr*.09,rr*.32);ctx.lineTo(k*rr*.09,rr*.42);ctx.stroke();}ctx.restore();return;}const c=colors[b.n],icy=freezeLeft>0;ctx.save();ctx.globalAlpha=alpha;const glow=b.selected?(1+.08*Math.sin(t*7)):1;if(b.selected){ctx.shadowBlur=23;ctx.shadowColor=c;ctx.strokeStyle='#d9faff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,rr*glow+3,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;}const g=ctx.createRadialGradient(x-rr*.34,y-rr*.43,rr*.04,x+rr*.2,y+rr*.27,rr*1.1);g.addColorStop(0,'#ffffff');g.addColorStop(.12,c);g.addColorStop(.56,c);g.addColorStop(1,'#09122d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();ctx.strokeStyle=icy?'#d6faff':c;ctx.globalAlpha=alpha*.9;ctx.lineWidth=icy?2.5:1.8;ctx.stroke();ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(x-rr*.34,y-rr*.5,rr*.29,rr*.12,-.6,0,Math.PI*2);ctx.fill();if(icy){ctx.save();ctx.beginPath();ctx.arc(x,y,rr*.96,0,Math.PI*2);ctx.clip();ctx.strokeStyle='#e9ffffaa';ctx.lineWidth=Math.max(1,rr*.045);for(let k=0;k<3;k++){const xx=x+rr*(-.52+k*.46);ctx.beginPath();ctx.moveTo(xx-rr*.2,y-rr*.78);ctx.lineTo(xx+rr*.08,y-rr*.24);ctx.lineTo(xx-rr*.1,y+rr*.22);ctx.stroke();}ctx.strokeStyle='#f0ffffbb';ctx.lineWidth=Math.max(2,rr*.085);ctx.beginPath();ctx.arc(x,y,rr*.89,-2.9,-.55);ctx.stroke();ctx.beginPath();ctx.arc(x,y,rr*.89,.2,1.5);ctx.stroke();ctx.re function update(dt){elapsed+=dt;const frozen=freezeLeft>0;if(frozen)freezeLeft=Math.max(0,freezeLeft-dt);const speed=cfg.speed+cfg.accel*elapsed/60;const step=frozen?0:speed*dt;for(const b of balls)b.y-=step;spawnY-=step;const spacing=2*r+cfg.gap;while(spawnY<=H-spacing){spawnY+=spacing;addRow(spawnY);}for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(b.y-b.r<=12){burst(b.x,Math.max(12,b.y),b.freeze?'#7befff':b.bomb?'#ff9a3c':b.bonus?'#ffcf4b':colors[b.n]);if(b.freeze||b.bomb||b.bonus){balls.splice(i,1);if(b.freeze||b.bomb){celebrate(b.bomb?'unusedBomb':'unusedFreeze',b.bomb?200:100);}else if(b.bonus){celebrate('super',b.bonus);}ding();continue;}if(b.selected)selected=selected.filter(q=>q!==b);balls.splice(i,1);errors++;explosion();if(errors>=cfg.maxErrors){errors=cfg.maxErrors;gameOver();break;}}}for(let i=flights.length-1;i>=0;i--){const f=flights[i];f.age+=dt;if(f.age<0)continue;const p=Math.min(1,f.age/.72);const e=p*p*(3-2*p);const scoreRect=$('#scoreSphere').getBoundingClientRect(),stageRect=canvas.getBoundingClientRect();const targetX=scoreRect.left+scoreRect.width/2-stageRect.left,targetY=scoreRect.top+scoreRect.height/2-stageRect.top;const x=f.sx+(targetX-f.sx)*e;const y=f.sy+(targetY-f.sy)*e-32*Math.sin(Math.PI*p);f.x=x;f.y=y;f.trail.push({x,y,life:.3});if(f.trail.length>20)f.trail.shift();if(p>=1){score+=f.bonus||10;scoreFlash=.25;ding();burst(x,Math.max(0,y),f.color);flights.splice(i,1);if(f.bonus){const sphere=$('#scoreSphere');sphere.classList.remove('bounce');void sphere.offsetWidth;sphere.classList.add('bounce');continue;}const remaining=(scorePending.get(f.batch)||1)-1;if(remaining<=0){scorePending.delete(f.batch);const sphere=$('#scoreSphere');sphere.classList.remove('bounce');void sphere.offsetWidth;sphere.classList.add('bounce');}else scorePending.set(f.batch,remaining);}}for(const f of flights)for(const tr of f.trail)tr.life-=dt;for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt;if(p.life<=0)particles.splice(i,1);}for(let i=bonusCelebrations.length-1;i>=0;i--){const b=bonusCelebrations[i];b.age+=dt;if(b.age>=1.65&&!b.launched){b.launched=true;$('#bonusShow').classList.remove('active');if(b.points)flights.push({x:b.x,y:b.y,sx:b.x,sy:b.y,n:0,bonus:b.points,age:0,color:b.type==='unusedFreeze'?'#7befff':'#ffcf4b',trail:[]});}if(b.age>1.9){bonusCelebrations.splice(i,1);startCelebration();}}for(let i=shockwaves.length-1;i>=0;i--){shockwaves[i].age+=dt;if(shockwaves[i].age>=.55)shockwaves.splice(i,1);}scoreFlash=Math.max(0,scoreFlash-dt);sync();}
function draw(t){ctx.clearRect(0,0,W,H);ctx.strokeStyle='#8ba8ff15';ctx.lineWidth=1;for(let y=H-40;y>0;y-=62){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}/* Piccole punte metalliche sul bordo superiore: le sfere scoppiano raggiungendole. */const spikeStep=18,spikeHeight=10;ctx.fillStyle='#8999b8';ctx.fillRect(0,0,W,3);for(let sx=0;sx<W;sx+=spikeStep){ctx.beginPath();ctx.moveTo(sx,2);ctx.lineTo(sx+spikeStep/2,spikeHeight+2);ctx.lineTo(Math.min(W,sx+spikeStep),2);ctx.closePath();ctx.fill();}ctx.strokeStyle='#c5d6f2';ctx.lineWidth=.8;ctx.beginPath();for(let sx=0;sx<W;sx+=spikeStep){ctx.moveTo(sx,2);ctx.lineTo(sx+spikeStep/2,spikeHeight+2);}ctx.stroke();for(const b of balls)drawBall(b,t,b.selected?1+.045*Math.sin(t*8):1);for(const wave of shockwaves){const p=Math.min(1,wave.age/.55),radius=wave.maxRadius*(1-Math.pow(1-p,2));ctx.save();ctx.globalAlpha=(1-p)*.85;ctx.shadowColor='#ff9c27';ctx.shadowBlur=20*(1-p);ctx.strokeStyle='#ffdf87';ctx.lineWidth=6*(1-p)+1;ctx.beginPath();ctx.arc(wave.x,wave.y,radius,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ff6422';ctx.lineWidth=12*(1-p)+1;ctx.globalAlpha=(1-p)*.35;ctx.beginPath();ctx.arc(wave.x,wave.y,radius+7,0,Math.PI*2);ctx.stroke();ctx.restore();}for(const f of flights){for(let j=0;j<f.trail.length;j++){const tr=f.trail[j];if(tr.life<=0)continue;ctx.globalAlpha=tr.life/.3*.5;ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(tr.x,tr.y,2.5+3*j/Math.max(1,f.trail.length),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;if(f.age>=0){const p=Math.min(1,f.age/.72);drawBall({x:f.x,y:f.y,r:r*.72*(1-.75*p),n:f.n,bonus:f.bonus||0},t,1);}}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.8);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;/* Banda inferiore opaca: le nuove sfere emergono gradualmente dal bordo. */const bandH=Math.max(24,r*.95);const bg=ctx.createLinearGradient(0,H-bandH,0,H);bg.addColorStop(0,'#101936');bg.addColorStop(1,'#080e22');ctx.fillStyle=bg;ctx.fillRect(0,H-bandH,W,bandH);ctx.fillStyle='#3c5a8c';ctx.fillRect(0,H-bandH,W,2);}
function loop(ts){if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;if(!paused){update(dt);musicTick();}else musicNext=0;draw(ts/1000);requestAnimationFrame(loop);}$('#scoreSphere').addEventListener('animationend',e=>{if(e.animationName==='scoreElastic')e.currentTarget.classList.remove('bounce');});window.addEventListener('resize',resize);resize();startScreen();requestAnimationFrame(loop);
