<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SUM 10 · Sfere</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080e22;color:#f5f8ff;display:flex;justify-content:center;min-height:100dvh}#app{width:min(100%,calc(100dvh * 390 / 844));max-width:430px;height:100dvh;min-height:500px;display:flex;flex-direction:column;background:linear-gradient(#141b3d,#080d20)}header{padding:12px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:20px;letter-spacing:2px;margin:0;color:#e7f5ff}small{color:#92a4d2}.stat{background:#202b50;border:1px solid #3a4b7b;border-radius:12px;padding:7px 11px;text-align:center;min-width:90px}.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:#b8c8ed}.top{display:flex;align-items:center;gap:7px;padding:0 12px 10px}.top .stat{flex:1}#scoreBox{flex:0 0 108px!important;min-width:108px;height:92px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:visible}#scoreBox .scoreSphere{width:88px;height:88px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 31% 23%,#f6ffff 0%,#9cf6ff 10%,#35d5ed 30%,#1671c7 62%,#102a78 84%,#09132c 100%);box-shadow:inset -9px -13px 16px #03132bba,inset 3px 4px 8px #e0ffff88,0 0 17px #20d5f577,0 6px 12px #0007;transform-origin:50% 75%;will-change:transform}#scoreBox .scoreSphere:before{content:"";position:absolute;left:17%;top:12%;width:44%;height:18%;border-radius:50%;transform:rotate(-30deg);background:#ffffff91;filter:blur(3px)}#scoreBox .scoreSphere span{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#e7ffff;z-index:1;text-shadow:0 1px 4px #003b69}#scoreBox .scoreSphere b{font-size:25px;line-height:1.15;color:white;text-shadow:0 2px 5px #002a59;z-index:1;max-width:82px;overflow:hidden;font-variant-numeric:tabular-nums}#scoreBox .scoreSphere.bounce{animation:scoreElastic .54s cubic-bezier(.2,.7,.25,1) both}@keyframes scoreElastic{0%{transform:translateY(0) scale(1)}20%{transform:translateY(6px) scale(1.16,.83)}48%{transform:translateY(-13px) scale(.92,1.12)}74%{transform:translateY(2px) scale(1.035,.97)}100%{transform:translateY(0) scale(1)}}.error{color:#ff8998!important}.stage{position:relative;flex:1;min-height:0;margin:0 10px;border:1px solid #3a4b79;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1d2a57 0%,#101936 55%,#0b1128 100%);touch-action:manipulation}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.hud{padding:9px 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:9px}.sum{font-size:20px;font-weight:750}.sum em{font-style:normal;color:#78e9f9}button{cursor:pointer;border:1px solid #52699e;background:#24355d;color:#fff;border-radius:10px;padding:10px 13px;font-weight:650}button.primary{background:linear-gradient(135deg,#14a6ca,#286de4);border:0}button:active{transform:scale(.97)}.buttons{display:flex;gap:6px}.overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#060c20c9;backdrop-filter:blur(5px);z-index:3;padding:22px}.panel{background:#1a2547;border:1px solid #52659c;border-radius:18px;padding:23px;width:min(100%,350px);box-shadow:0 20px 60px #0008}.panel h2{margin:0 0 8px;font-size:26px}.panel p{line-height:1.45;color:#c9d7f6}.panel label{display:block;margin:16px 0 6px;font-size:14px}.panel input{width:100%;accent-color:#3ccbe4}.panel output{float:right;color:#8ee6fa}.panel .primary{width:100%;margin-top:14px;padding:13px}.hidden{display:none}.note{font-size:12px;color:#98abd7;text-align:center;margin:0 0 5px}@media (min-width:700px) and (orientation:portrait){#app{width:100%;max-width:none;height:100dvh;min-height:0}header{padding:18px 26px 14px}.top{padding:0 22px 16px}.stage{margin:0 18px}.hud{padding:16px 24px}.note{padding-bottom:8px}.panel{width:min(90%,440px)}}@media (min-width:700px) and (orientation:landscape){#app{width:min(100%,calc(100dvh * 390 / 844));max-width:430px}}#app{min-width:0;overflow:hidden}.top{min-width:0}.top .stat{min-width:0;padding:7px 5px}.top .stat b{font-size:clamp(16px,5vw,24px)}.hud{min-width:0;flex-wrap:wrap}.overlay{padding:12px;overflow-y:auto}.panel{max-width:100%;max-height:100%;overflow-y:auto;padding:clamp(12px,4vw,23px)}.panel h2{font-size:clamp(19px,5vw,26px)}.panel p{font-size:clamp(13px,3.7vw,16px)}@media(max-width:450px){header{padding:10px 12px;gap:6px}header small{font-size:11px}#settings{padding:8px;font-size:12px}.top{gap:4px;padding:0 8px 8px}#scoreBox{flex:0 0 88px!important;min-width:88px;height:80px}#scoreBox .scoreSphere{width:76px;height:76px}.stage{margin:0 7px}.hud{padding:8px;gap:5px}.sum{font-size:17px}.buttons button{padding:8px 9px;font-size:12px}.note{font-size:10px;padding:0 7px}}@media(max-width:370px){.stat{min-width:0;padding:7px}h1{font-size:17px}.hud{padding:8px}}
</style></head><body><div id="app"><header><div><h1>SUM <span style="color:#58e7f3">10</span></h1><small>Seleziona le sfere, raggiungi dieci</small></div><button id="settings">⚙ Opzioni</button></header><div class="top"><div class="stat" id="scoreBox"><div class="scoreSphere" id="scoreSphere"><span>SCORE</span><b id="score">0</b></div></div><div class="stat"><span>ERRORI</span><b class="error" id="errors">0 / 10</b></div><div class="stat"><span>TEMPO</span><b id="time">0:00</b></div></div><div class="stage" id="stage"><canvas id="game"></canvas><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div><div class="hud"><div class="sum">SOMMA <em id="sum">0</em> <span style="color:#8393b6">/ 10</span></div><div class="buttons"><button id="clear">Annulla</button><button id="pause">Pausa</button></div></div><p class="note">Seleziona qualsiasi sfera • 10 punti per ogni sfera combinata</p></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');const $=s=>document.querySelector(s);const colors=['','#ff354f','#ff8a1d','#f6d528','#45e663','#22d9c5','#258cf9','#9355f6','#e52cc8','#ff68ad'];let cfg={speed:22,accel:5,gap:12.6,maxErrors:10,sound:true,volume:55};let balls=[],particles=[],flights=[],selected=[],score=0,errors=0,elapsed=0,spawnY=0,paused=true,ended=false,last=0,W=400,H=600,r=30,nextId=0,scoreFlash=0,scoreBatch=0,scorePending=new Map(),mode='start';let audioCtx=null;function audio(){if(!cfg.sound)return null;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}catch{return null;}}
function pop(deselect=false){const a=audio();if(!a)return;const play=()=>{const t=a.currentTime+.005,o=a.createOscillator(),g=a.createGain(),filter=a.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(deselect?420:690,t);o.frequency.exponentialRampToValueAtTime(deselect?240:330,t+.115);filter.type='lowpass';filter.frequency.value=1800;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,cfg.volume/100*.42),t+.009);g.gain.exponentialRampToValueAtTime(.0001,t+.145);o.connect(filter).connect(g).connect(a.destination);o.start(t);o.stop(t+.15);};if(a.state==='running')play();else a.resume().then(play).catch(()=>{});}
function ding(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(750,t);o.frequency.exponentialRampToValueAtTime(1100,t+.11);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,cfg.volume/100*.075),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.17);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.18);}
function explosion(){const a=audio();if(!a)return;const t=a.currentTime,d=.24,buffer=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),data=buffer.getChannelData(0);let prev=0;for(let i=0;i<data.length;i++){const white=Math.random()*2-1;prev=(prev+white*.18)/1.18;data[i]=prev*Math.pow(1-i/data.length,2);}const source=a.createBufferSource(),filter=a.createBiquadFilter(),g=a.createGain();source.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(1350,t);filter.frequency.exponentialRampToValueAtTime(180,t+d);g.gain.value=cfg.volume/100*.85;source.connect(filter).connect(g).connect(a.destination);source.start(t);source.stop(t+d);}
const rand=()=>1+Math.floor(Math.random()*9);const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function resize(){const rect=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=rect.width;H=rect.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);r=Math.min(W>=700?75:35,(W-24)/10.7);}
function addRow(y){const spacing=(W-24)/5;for(let i=0;i<5;i++)balls.push({id:++nextId,n:rand(),x:12+spacing*(i+.5),y,r:r*.87,selected:false,dy:0});}
function reset(){balls=[];particles=[];flights=[];selected=[];score=0;errors=0;elapsed=0;scoreFlash=0;scoreBatch=0;scorePending.clear();document.querySelector('#scoreSphere').classList.remove('bounce');nextId=0;addRow(H+r*.6);spawnY=H+r*.6;paused=false;ended=false;mode='play';overlay.classList.add('hidden');sync();}
function sync(){ $('#score').textContent=score;$('#errors').textContent=errors+' / '+cfg.maxErrors;$('#sum').textContent=selected.reduce((s,b)=>s+b.n,0);$('#time').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');}
function show(title,body,buttons){panel.innerHTML='<h2>'+title+'</h2><p>'+body+'</p>'+buttons;overlay.classList.remove('hidden');}
function startScreen(){mode='start';paused=true;show('Pronto a giocare?','Le righe di cinque sfere salgono verso la cima. Seleziona sfere che sommano <b>10</b>: ogni sfera vale 10 punti. Dopo <b>10 esplosioni</b> la partita termina.','<button class="primary" id="go">Inizia partita</button>');$('#go').onclick=reset;}
function options(){const wasPaused=paused;paused=true;mode='options';show('Opzioni','Personalizza il ritmo della partita.',`<label>Velocità iniziale <output id="sv">${cfg.speed}</output></label><input id="speed" type="range" min="8" max="70" value="${cfg.speed}"><label>Accelerazione (pixel/s ogni minuto) <output id="av">${cfg.accel}</output></label><input id="accel" type="range" min="0" max="35" value="${cfg.accel}"><label>Distanza tra le righe <output id="gv">${cfg.gap}</output></label><input id="gap" type="range" min="0" max="75" step="0.5" value="${cfg.gap}"><label>Errori massimi <output id="ev">${cfg.maxErrors}</output></label><input id="maxErrors" type="range" min="1" max="20" value="${cfg.maxErrors}"><label style="display:flex;align-items:center;gap:10px"><input id="sound" type="checkbox" ${cfg.sound?"checked":""} style="width:20px;height:20px"> Effetti sonori</label><label>Volume effetti <output id="vv">${cfg.volume}%</output></label><input id="volume" type="range" min="0" max="100" value="${cfg.volume}"><button class="primary" id="save">Salva e torna al gioco</button>`);for(const [k,o] of [['speed','sv'],['accel','av'],['gap','gv'],['maxErrors','ev'],['volume','vv']])$('#'+k).oninput=e=>$('#'+o).textContent=e.target.value;$('#save').onclick=()=>{for(const k of Object.keys(cfg))cfg[k]=k==='sound'?$('#sound').checked:Number($('#'+k).value);sync();if(ended){gameOver();return;}if(mode==='options'&&balls.length===0&&elapsed===0){startScreen();return;}paused=wasPaused;mode='play';overlay.classList.add('hidden');};}
function gameOver(){ended=true;paused=true;mode='over';show('GAME OVER','Hai raggiunto <b>'+errors+' errori</b>.<br>Punteggio finale: <b style="font-size:30px;color:#6be6f6">'+score+'</b><br>Tempo: '+$('#time').textContent,'<button class="primary" id="again">Rigioca</button>');$('#again').onclick=reset;}
function burst(x,y,color){for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,v=35+Math.random()*110;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.45+Math.random()*.4,max:.8,color,size:2+Math.random()*4});}}
function complete(){const arr=[...selected];const batch=++scoreBatch;scorePending.set(batch,arr.length);selected=[];balls=balls.filter(b=>!arr.includes(b));arr.forEach((b,i)=>flights.push({x:b.x,y:b.y,sx:b.x,sy:b.y,n:b.n,age:-i*.10,color:colors[b.n],trail:[],batch}));sync();}
function choose(x,y){if(paused||ended)return;let b=null,best=Infinity;for(const q of balls){const d=dist(q,{x,y});if(d<q.r*1.2&&d<best){b=q;best=d;}}if(!b)return;pop(b.selected);if(b.selected){b.selected=false;selected=selected.filter(v=>v!==b);}else{b.selected=true;selected.push(b);}const total=selected.reduce((s,v)=>s+v.n,0);if(total>10){selected.forEach(v=>v.selected=false);selected=[];}else if(total===10)complete();sync();}
canvas.addEventListener('pointerdown',e=>{audio();const rect=canvas.getBoundingClientRect();choose((e.clientX-rect.left)*W/rect.width,(e.clientY-rect.top)*H/rect.height);});$('#clear').onclick=()=>{selected.forEach(b=>b.selected=false);selected=[];sync();};$('#settings').onclick=options;$('#pause').onclick=()=>{if(ended)return;if(mode==='options')return;if(paused){paused=false;overlay.classList.add('hidden');mode='play';$('#pause').textContent='Pausa';}else{paused=true;mode='pause';show('In pausa','La partita è momentaneamente sospesa.','<button class="primary" id="resume">Riprendi</button>');$('#resume').onclick=()=>{paused=false;mode='play';overlay.classList.add('hidden');$('#pause').textContent='Pausa';};}};
function drawBall(b,t,scale=1,alpha=1){const rr=b.r*scale,x=b.x,y=b.y,c=colors[b.n];ctx.save();ctx.globalAlpha=alpha;const glow=b.selected?(1+.08*Math.sin(t*7)):1;if(b.selected){ctx.shadowBlur=23;ctx.shadowColor=c;ctx.strokeStyle='#d9faff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,rr*glow+3,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;}const g=ctx.createRadialGradient(x-rr*.34,y-rr*.43,rr*.04,x+rr*.2,y+rr*.27,rr*1.1);g.addColorStop(0,'#ffffff');g.addColorStop(.12,c);g.addColorStop(.56,c);g.addColorStop(1,'#09122d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();ctx.strokeStyle=c;ctx.globalAlpha=alpha*.9;ctx.lineWidth=1.8;ctx.stroke();ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(x-rr*.34,y-rr*.5,rr*.29,rr*.12,-.6,0,Math.PI*2);ctx.fill();ctx.globalAlpha=alpha;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 '+Math.round(rr*.99)+'px system-ui';ctx.shadowColor='#0009';ctx.shadowBlur=3;ctx.fillText(b.n,x,y+1);ctx.restore();}
function update(dt){elapsed+=dt;const speed=cfg.speed+cfg.accel*elapsed/60;const step=speed*dt;for(const b of balls)b.y-=step;spawnY-=step;const spacing=2*r+cfg.gap;while(spawnY<=H-spacing){spawnY+=spacing;addRow(spawnY);}for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(b.y+b.r<0){burst(b.x,Math.max(10,b.r*.3),colors[b.n]);if(b.selected)selected=selected.filter(q=>q!==b);balls.splice(i,1);errors++;explosion();if(errors>=cfg.maxErrors){errors=cfg.maxErrors;gameOver();break;}}}for(let i=flights.length-1;i>=0;i--){const f=flights[i];f.age+=dt;if(f.age<0)continue;const p=Math.min(1,f.age/.72);const e=p*p*(3-2*p);const scoreRect=$('#scoreSphere').getBoundingClientRect(),stageRect=canvas.getBoundingClientRect();const targetX=scoreRect.left+scoreRect.width/2-stageRect.left,targetY=scoreRect.top+scoreRect.height/2-stageRect.top;const x=f.sx+(targetX-f.sx)*e;const y=f.sy+(targetY-f.sy)*e-32*Math.sin(Math.PI*p);f.x=x;f.y=y;f.trail.push({x,y,life:.3});if(f.trail.length>20)f.trail.shift();if(p>=1){score+=10;scoreFlash=.25;ding();burst(x,Math.max(0,y),f.color);flights.splice(i,1);const remaining=(scorePending.get(f.batch)||1)-1;if(remaining<=0){scorePending.delete(f.batch);const sphere=$('#scoreSphere');sphere.classList.remove('bounce');void sphere.offsetWidth;sphere.classList.add('bounce');}else scorePending.set(f.batch,remaining);}}for(const f of flights)for(const tr of f.trail)tr.life-=dt;for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt;if(p.life<=0)particles.splice(i,1);}scoreFlash=Math.max(0,scoreFlash-dt);sync();}
function draw(t){ctx.clearRect(0,0,W,H);ctx.strokeStyle='#8ba8ff15';ctx.lineWidth=1;for(let y=H-40;y>0;y-=62){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.fillStyle='#ff5e7255';ctx.fillRect(0,0,W,3);ctx.fillStyle='#ff8a9b';ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillText('ZONA ESPLOSIONE',W/2,16);for(const b of balls)drawBall(b,t,b.selected?1+.045*Math.sin(t*8):1);for(const f of flights){for(let j=0;j<f.trail.length;j++){const tr=f.trail[j];if(tr.life<=0)continue;ctx.globalAlpha=tr.life/.3*.5;ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(tr.x,tr.y,2.5+3*j/Math.max(1,f.trail.length),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;if(f.age>=0){const p=Math.min(1,f.age/.72);drawBall({x:f.x,y:f.y,r:r*.72*(1-.75*p),n:f.n},t,1);}}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.8);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;/* Banda inferiore opaca: le nuove sfere emergono gradualmente dal bordo. */const bandH=Math.max(24,r*.95);const bg=ctx.createLinearGradient(0,H-bandH,0,H);bg.addColorStop(0,'#101936');bg.addColorStop(1,'#080e22');ctx.fillStyle=bg;ctx.fillRect(0,H-bandH,W,bandH);ctx.fillStyle='#3c5a8c';ctx.fillRect(0,H-bandH,W,2);}
function loop(ts){if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;if(!paused)update(dt);draw(ts/1000);requestAnimationFrame(loop);}$('#scoreSphere').addEventListener('animationend',e=>{if(e.animationName==='scoreElastic')e.currentTarget.classList.remove('bounce');});window.addEventListener('resize',resize);resize();startScreen();requestAnimationFrame(loop);
})();
</script></body></html>
